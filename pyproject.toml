[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "episodic-world-model"
version = "0.1.0"
description = "V-JEPA 2.1 Latent World Model for Episodic Segmentation and Spatio-Temporal Grounding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "datasets>=2.18.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
